<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020617">
<title>FT TRADE | Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 100% 0%,#164e63 0,transparent 35%),
    radial-gradient(circle at 0% 100%,#172554 0,transparent 35%),
    #020617;
  overflow:auto;
}

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.circle{
  position:absolute;
  width:270px;
  height:270px;
  right:-120px;
  top:-110px;
  border:1px solid #38bdf822;
  border-radius:50%;
}

.circle2{
  position:absolute;
  width:190px;
  height:190px;
  left:-100px;
  bottom:-80px;
  border:1px solid #2563eb22;
  border-radius:50%;
}

.box{
  position:relative;
  width:100%;
  max-width:430px;
  padding:30px 24px 24px;
  border:1px solid #ffffff15;
  border-radius:30px;
  background:#ffffff09;
  box-shadow:0 25px 70px #0009;
  backdrop-filter:blur(18px);
}

.brand{
  text-align:center;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:21px;
  background:linear-gradient(145deg,#06b6d4,#2563eb);
  font-size:19px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 12px 35px #2563eb55;
}

.brand h1{
  margin-top:17px;
  font-size:27px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand p{
  margin-top:6px;
  color:#94a3b8;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
}

.line{
  width:55px;
  height:3px;
  margin:13px auto 0;
  border-radius:10px;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
}

form{
  margin-top:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#cbd5e1;
  font-size:10px;
  font-weight:800;
}

.inputWrap{
  position:relative;
}

input{
  width:100%;
  height:51px;
  padding:0 45px 0 15px;
  border:1px solid #ffffff14;
  border-radius:15px;
  outline:none;
  background:#020617aa;
  color:#fff;
  font-size:13px;
  transition:.2s;
}

input::placeholder{
  color:#64748b;
}

input:focus{
  border-color:#38bdf866;
  box-shadow:0 0 0 3px #38bdf40d;
}

.eye{
  position:absolute;
  right:8px;
  top:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:9px;
  background:#ffffff0d;
  color:#94a3b8;
  font-size:13px;
}

.login{
  width:100%;
  height:53px;
  margin-top:23px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-size:11px;
  font-weight:900;
  letter-spacing:.6px;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  box-shadow:0 10px 25px #2563eb40;
  transition:.18s;
}

.login:active{
  transform:scale(.98);
}

.login:disabled{
  opacity:.6;
}

.msg{
  min-height:18px;
  margin-top:13px;
  text-align:center;
  color:#f87171;
  font-size:10px;
  font-weight:bold;
}

.bottom{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #ffffff0d;
  text-align:center;
  color:#64748b;
  font-size:10px;
}

.bottom a{
  color:#38bdf8;
  text-decoration:none;
  font-weight:900;
}

.secure{
  margin-top:14px;
  text-align:center;
  color:#475569;
  font-size:8px;
  letter-spacing:.5px;
}

@media(max-height:650px){
  body{
    align-items:flex-start;
  }

  .box{
    margin:10px 0;
  }
}
</style>
</head>

<body>

<div class="bg">
  <div class="circle"></div>
  <div class="circle2"></div>
</div>

<div class="box">

  <div class="brand">

    <div class="logo">FT</div>

    <h1>FT TRADE</h1>

    <p>PREMIUM DIGITAL WORKSPACE</p>

    <div class="line"></div>

  </div>

  <form id="loginForm">

    <label>Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label>Password</label>

    <div class="inputWrap">

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        class="eye"
        type="button"
        onclick="togglePassword()">
        ◉
      </button>

    </div>

    <button
      class="login"
      id="loginBtn"
      type="submit">
      LOGIN
    </button>

    <div
      class="msg"
      id="msg">
    </div>

  </form>

  <div class="bottom">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

  <div class="secure">
    FT TRADE • SECURE ACCESS
  </div>

</div>

<script>

const API="https://techno-priority-meditation-enterprises.trycloudflare.com";
  
const form=document.getElementById("loginForm");
const email=document.getElementById("email");
const password=document.getElementById("password");
const btn=document.getElementById("loginBtn");
const msg=document.getElementById("msg");

function togglePassword(){

  if(password.type==="password"){
    password.type="text";
  }else{
    password.type="password";
  }

}

form.addEventListener("submit",async function(e){

  e.preventDefault();

  msg.textContent="";
  msg.style.color="#f87171";

  const userEmail=email.value.trim();
  const userPassword=password.value;

  if(!userEmail || !userPassword){
    msg.textContent="Please enter email and password.";
    return;
  }

  btn.disabled=true;
  btn.textContent="LOGIN...";

  try{

    const response=await fetch(
      API+"/api/login",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:userEmail,
          password:userPassword
        })
      }
    );

    const data=await response.json();

    if(!data.success){

      msg.textContent=
        data.message ||
        "Invalid email or password.";

      btn.disabled=false;
      btn.textContent="LOGIN";
      return;
    }

    if(data.user){

      localStorage.setItem(
        "ftUser",
        JSON.stringify(data.user)
      );

    }

    msg.style.color="#4ade80";
    msg.textContent="Login successful.";

    setTimeout(function(){

      window.location.href="dashboard.html";

    },500);

  }catch(error){

    console.log(error);

    msg.textContent=
      "Server connection failed.";

    btn.disabled=false;
    btn.textContent="LOGIN";

  }

});

</script>

</body>
</html>
